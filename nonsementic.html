<!DOCTYPE html>
<html>
<head>
  <title>Non Semantic HTML</title>
</head>
<body>

  <div id="header">
    <div class="logo">My Website</div>
    <div class="nav">
      <span>Home</span>
      <span>About</span>
      <span>Contact</span>
    </div>
  </div>

  <div id="content">
    <div class="section">
      <div class="heading">Article Title</div>
      <div class="text">
        <span>This is the article content.</span>
      </div>
    </div>
  </div>

  <div id="footer">
    <span>© 2025 My Website</span>
  </div>

</body>
</html>
